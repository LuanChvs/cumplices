      <stop offset="0%" stop-color="#e79fc4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e79fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="-10%" cy="110%" r="70%">
      <stop offset="0%" stop-color="#6fd6c4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6fd6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#161022"/>
