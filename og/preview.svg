        font-family="Georgia, 'Times New Roman', serif"
        font-weight="600" font-size="96" letter-spacing="-1"
        fill="#f5f0e8">em dupla<tspan fill="#f2946b" font-size="52" font-weight="400" font-style="italic"> (ou +)</tspan></text>

