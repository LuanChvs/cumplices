name: Split game CSS

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  split:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.title, '[CSS SPLIT DONE]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Split game styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          style_path = Path('css/style.css')
          css = style_path.read_text(encoding='utf-8')

          def block(start, end):
              m = re.search(re.escape(start) + r'.*?(?=\n' + re.escape(end) + r')', css, re.S)
              if not m: raise SystemExit(f'Marker not found: {start}')
              return m.group(0).rstrip() + '\n'
          def remove(start, end):
              nonlocal_css[0], n = re.subn(r'\n*' + re.escape(start) + r'.*?(?=\n' + re.escape(end) + r')', '', nonlocal_css[0], count=1, flags=re.S)
              if n != 1: raise SystemExit(f'Block not removed: {start}')
          nonlocal_css = [css]

          sintonia = block('/* =========================================================\n   SINTONIA\n========================================================= */', '/* =========================================================\n   STOP\n========================================================= */')
          stop_base = block('/* =========================================================\n   STOP\n========================================================= */', '/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */')
          verdade = block('/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */', '/* =========================================================\n   QUIZ\n========================================================= */')
          quiz = block('/* =========================================================\n   QUIZ\n========================================================= */', '/* =========================================================\n   TIC-TAC-TOE\n========================================================= */')
          velha = block('/* =========================================================\n   TIC-TAC-TOE\n========================================================= */', '/* =========================================================\n   SETTINGS\n========================================================= */')
          xadrez = block('/* =========================================================\n   XADREZ — BASE\n========================================================= */', '/* =========================================================\n   RESPONSIVIDADE GERAL — MOBILE\n========================================================= */')
          stop_responsive = block('/* =========================================================\n   STOP — LAYOUT RESPONSIVO DE TELA CHEIA\n========================================================= */', '/* =========================================================\n   REDUÇÃO DE MOVIMENTO\n========================================================= */')

          for a,b in [
            ('/* =========================================================\n   SINTONIA\n========================================================= */','/* =========================================================\n   STOP\n========================================================= */'),
            ('/* =========================================================\n   STOP\n========================================================= */','/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */'),
            ('/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */','/* =========================================================\n   QUIZ\n========================================================= */'),
            ('/* =========================================================\n   QUIZ\n========================================================= */','/* =========================================================\n   TIC-TAC-TOE\n========================================================= */'),
            ('/* =========================================================\n   TIC-TAC-TOE\n========================================================= */','/* =========================================================\n   SETTINGS\n========================================================= */'),
            ('/* =========================================================\n   XADREZ — BASE\n========================================================= */','/* =========================================================\n   RESPONSIVIDADE GERAL — MOBILE\n========================================================= */'),
            ('/* =========================================================\n   STOP — LAYOUT RESPONSIVO DE TELA CHEIA\n========================================================= */','/* =========================================================\n   REDUÇÃO DE MOVIMENTO\n========================================================= */'),
          ]:
              remove(a,b)
          css = nonlocal_css[0]

          sintonia += '''\n@media (max-width: 520px) { .question-card { padding-left: 20px; padding-right: 20px; } }\n@media (max-width: 380px) { .category-ring { gap: 6px; } .cat-chip { padding-left: 5px; padding-right: 5px; font-size: .74rem; } }\n'''
          verdade += '''\n@media (max-width: 520px) { .vd-card { padding-left: 20px; padding-right: 20px; } }\n'''
          quiz += '''\n@media (max-width: 520px) { .quiz-q { padding-left: 20px; padding-right: 20px; } }\n@media (max-width: 480px) { .quiz-buttons { grid-template-columns: 1fr; } }\n'''
          velha += '''\n@media (max-width: 480px) { .tic-board { gap: 6px; } .tic-cell { border-radius: 14px; } }\n'''
          xadrez += '''\n@media (max-width: 380px) { .chess-board-frame { padding: 4px; } }\n'''

          out = Path('css/games'); out.mkdir(parents=True, exist_ok=True)
          (out/'sintonia.css').write_text(sintonia, encoding='utf-8')
          (out/'stop.css').write_text(stop_base+'\n'+stop_responsive, encoding='utf-8')
          (out/'verdade.css').write_text(verdade, encoding='utf-8')
          (out/'quiz.css').write_text(quiz, encoding='utf-8')
          (out/'velha.css').write_text(velha, encoding='utf-8')
          (out/'xadrez.css').write_text(xadrez, encoding='utf-8')
          style_path.write_text(css, encoding='utf-8')
          PY

      - name: Move Quem Sou Eu CSS and update index
        run: |
          mkdir -p css/games
          mv css/quem-sou-eu.css css/games/quem-sou-eu.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html'); s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="stylesheet" href="css/quem-sou-eu.css">', '')
          anchor = '<link rel="stylesheet" href="css/style.css">'
          links = '''<link rel="stylesheet" href="css/style.css">\n<link rel="stylesheet" href="css/games/sintonia.css">\n<link rel="stylesheet" href="css/games/stop.css">\n<link rel="stylesheet" href="css/games/verdade.css">\n<link rel="stylesheet" href="css/games/quiz.css">\n<link rel="stylesheet" href="css/games/velha.css">\n<link rel="stylesheet" href="css/games/xadrez.css">\n<link rel="stylesheet" href="css/games/quem-sou-eu.css">'''
          if anchor not in s: raise SystemExit('style anchor not found')
          p.write_text(s.replace(anchor, links, 1), encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          test -f css/games/sintonia.css
          test -f css/games/stop.css
          test -f css/games/verdade.css
          test -f css/games/quiz.css
          test -f css/games/velha.css
          test -f css/games/xadrez.css
          test -f css/games/quem-sou-eu.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css css/games index.html
          git rm -f .github/workflows/split-game-css.yml
          git commit -m "[CSS SPLIT DONE] refactor(css): split game styles"
          git push
