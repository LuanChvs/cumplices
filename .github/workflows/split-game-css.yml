name: Split game CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    if: ${{ !contains(github.event.head_commit.message, 'refactor(css): split game styles') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split game styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          style_path = Path('css/style.css')
          css = style_path.read_text(encoding='utf-8')

          def extract(start_marker, end_marker):
              pattern = re.escape(start_marker) + r'.*?(?=\\n' + re.escape(end_marker) + r')'
              m = re.search(pattern, css, re.S)
              if not m:
                  raise SystemExit(f'Marker not found: {start_marker}')
              return m.group(0).rstrip() + '\\n'

          def remove(start_marker, end_marker):
              nonlocal css
              pattern = r'\\n*' + re.escape(start_marker) + r'.*?(?=\\n' + re.escape(end_marker) + r')'
              css, n = re.subn(pattern, '', css, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Block not removed: {start_marker}')

          sintonia = extract('/* =========================================================\n   SINTONIA\n========================================================= */', '/* =========================================================\n   STOP\n========================================================= */')
          stop_base = extract('/* =========================================================\n   STOP\n========================================================= */', '/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */')
          verdade = extract('/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */', '/* =========================================================\n   QUIZ\n========================================================= */')
          quiz = extract('/* =========================================================\n   QUIZ\n========================================================= */', '/* =========================================================\n   TIC-TAC-TOE\n========================================================= */')
          velha = extract('/* =========================================================\n   TIC-TAC-TOE\n========================================================= */', '/* =========================================================\n   SETTINGS\n========================================================= */')
          xadrez = extract('/* =========================================================\n   XADREZ — BASE\n========================================================= */', '/* =========================================================\n   RESPONSIVIDADE GERAL — MOBILE\n========================================================= */')
          stop_responsive = extract('/* =========================================================\n   STOP — LAYOUT RESPONSIVO DE TELA CHEIA\n========================================================= */', '/* =========================================================\n   REDUÇÃO DE MOVIMENTO\n========================================================= */')

          remove('/* =========================================================\n   SINTONIA\n========================================================= */', '/* =========================================================\n   STOP\n========================================================= */')
          remove('/* =========================================================\n   STOP\n========================================================= */', '/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */')
          remove('/* =========================================================\n   VERDADE OU DESAFIO\n========================================================= */', '/* =========================================================\n   QUIZ\n========================================================= */')
          remove('/* =========================================================\n   QUIZ\n========================================================= */', '/* =========================================================\n   TIC-TAC-TOE\n========================================================= */')
          remove('/* =========================================================\n   TIC-TAC-TOE\n========================================================= */', '/* =========================================================\n   SETTINGS\n========================================================= */')
          remove('/* =========================================================\n   XADREZ — BASE\n========================================================= */', '/* =========================================================\n   RESPONSIVIDADE GERAL — MOBILE\n========================================================= */')
          remove('/* =========================================================\n   STOP — LAYOUT RESPONSIVO DE TELA CHEIA\n========================================================= */', '/* =========================================================\n   REDUÇÃO DE MOVIMENTO\n========================================================= */')

          # Overrides que originalmente vinham depois dos blocos dos jogos.
          sintonia += '''\n/* Overrides responsivos originalmente definidos no CSS global. */\n@media (max-width: 520px) {\n  .question-card { padding-left: 20px; padding-right: 20px; }\n}\n@media (max-width: 380px) {\n  .category-ring { gap: 6px; }\n  .cat-chip { padding-left: 5px; padding-right: 5px; font-size: .74rem; }\n}\n'''
          verdade += '''\n/* Override responsivo originalmente definido no CSS global. */\n@media (max-width: 520px) {\n  .vd-card { padding-left: 20px; padding-right: 20px; }\n}\n'''
          quiz += '''\n/* Overrides responsivos originalmente definidos no CSS global. */\n@media (max-width: 520px) {\n  .quiz-q { padding-left: 20px; padding-right: 20px; }\n}\n@media (max-width: 480px) {\n  .quiz-buttons { grid-template-columns: 1fr; }\n}\n'''
          velha += '''\n/* Overrides responsivos originalmente definidos no CSS global. */\n@media (max-width: 480px) {\n  .tic-board { gap: 6px; }\n  .tic-cell { border-radius: 14px; }\n}\n'''
          xadrez += '''\n/* Override responsivo originalmente definido no CSS global. */\n@media (max-width: 380px) {\n  .chess-board-frame { padding: 4px; }\n}\n'''

          out = Path('css/games')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'sintonia.css').write_text(sintonia, encoding='utf-8')
          (out / 'stop.css').write_text(stop_base + '\n' + stop_responsive, encoding='utf-8')
          (out / 'verdade.css').write_text(verdade, encoding='utf-8')
          (out / 'quiz.css').write_text(quiz, encoding='utf-8')
          (out / 'velha.css').write_text(velha, encoding='utf-8')
          (out / 'xadrez.css').write_text(xadrez, encoding='utf-8')

          style_path.write_text(css, encoding='utf-8')
          PY

      - name: Move Quem Sou Eu CSS and update index
        run: |
          mkdir -p css/games
          mv css/quem-sou-eu.css css/games/quem-sou-eu.css
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="stylesheet" href="css/quem-sou-eu.css">', '')
          anchor = '<link rel="stylesheet" href="css/style.css">'
          links = '''<link rel="stylesheet" href="css/style.css">\n<link rel="stylesheet" href="css/games/sintonia.css">\n<link rel="stylesheet" href="css/games/stop.css">\n<link rel="stylesheet" href="css/games/verdade.css">\n<link rel="stylesheet" href="css/games/quiz.css">\n<link rel="stylesheet" href="css/games/velha.css">\n<link rel="stylesheet" href="css/games/xadrez.css">\n<link rel="stylesheet" href="css/games/quem-sou-eu.css">'''
          if anchor not in s:
              raise SystemExit('style anchor not found')
          s = s.replace(anchor, links, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
            'css/style.css',
            'css/games/sintonia.css',
            'css/games/stop.css',
            'css/games/verdade.css',
            'css/games/quiz.css',
            'css/games/velha.css',
            'css/games/xadrez.css',
            'css/games/quem-sou-eu.css',
            'index.html',
          ]
          for p in required:
              if not Path(p).exists(): raise SystemExit(f'Missing {p}')
          css = Path('css/style.css').read_text(encoding='utf-8')
          forbidden = ['/* SINTONIA', '/* STOP', '/* VERDADE OU DESAFIO', '/* QUIZ', '/* TIC-TAC-TOE', '/* XADREZ — BASE', '/* STOP — LAYOUT RESPONSIVO']
          for marker in forbidden:
              if marker in css: raise SystemExit(f'Game block still in style.css: {marker}')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css css/games index.html
          git rm -f .github/workflows/split-game-css.yml
          git commit -m "refactor(css): split game styles"
          git push
